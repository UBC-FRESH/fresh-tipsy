# Tool configuration for the UBC-FRESH dev workflow and the fresh-tipsy package.
# Each gate configured here is also a check in the green dashboard
# (scripts/dashboard.py).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fresh-tipsy"
version = "0.1.0"
description = "A provenance-first Python interoperability layer for BC TIPSY and FAN$IER tables."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "UBC FRESH Lab" }]
dependencies = ["typer>=0.12", "jsonschema>=4.20"]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
fresh-tipsy = "fresh_tipsy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fresh_tipsy.tables" = ["data/*.csv", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts", "tests", "src"]
extend-exclude = ["tmp", "_build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "ANN", "N", "PT", "SIM", "RUF", "C4"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"templates/project/tests/**" = ["D"]
"docs/conf.py" = ["D", "ANN", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "scripts"
files = ["scripts", "src", "tests", "docs/conf.py"]

[[tool.mypy.overrides]]
module = ["numpydoc", "numpydoc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=scripts --cov=src/fresh_tipsy --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["scripts", "src/fresh_tipsy"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']
